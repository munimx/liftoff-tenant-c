name: Liftoff Deploy

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f Dockerfile \
            -t registry.digitalocean.com/liftoff/live-logs-test/test:$IMAGE_TAG \
            .
          docker push registry.digitalocean.com/liftoff/live-logs-test/test:$IMAGE_TAG

      - name: Notify Liftoff
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          curl -X POST https://aniya-preservable-harriett.ngrok-free.dev/api/v1/webhooks/deploy-complete \
            -H "X-Liftoff-Secret: ${{ secrets.LIFTOFF_DEPLOY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"environmentId\":\"cmoogpr0x0009yeddxvly8o0w\",\"imageUri\":\"registry.digitalocean.com/liftoff/live-logs-test/test:$IMAGE_TAG\",\"commitSha\":\"$GITHUB_SHA\"}"
